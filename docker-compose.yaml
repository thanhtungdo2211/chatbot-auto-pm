  redis:
    image: redis:7-alpine
    container_name: awesome-agent-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - agent-network
    command: redis-server --appendonly yes

  # Optional: Redis Commander for GUI management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: awesome-agent-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - agent-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  agent-network:
    driver: bridge
